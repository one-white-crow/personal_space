server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态页面（单页，历史路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Service Worker：不缓存、正确 MIME
    # 注意：必须用 types{}/default_type 设置类型，不能用 add_header Content-Type，
    # 否则会与 nginx 自带的 Content-Type 叠加成两个同名响应头，浏览器会取到错误的那个。
    location = /sw.js {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA manifest：正确 MIME（mime.types 里没有 webmanifest，必须显式指定）
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 图标等静态资源缓存
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 安全：禁止访问后端源码 / 版本控制 / 配置等敏感路径
    location ~ ^/(server|\.git|\.github|\.workbuddy|node_modules|dist)/ {
        deny all;
        return 404;
    }
}

# ============================================================
# 个人简历 / 作品集站（React + Vite 构建产物）
#   me.hongshenyu.dpdns.org  ->  /srv/portfolio（宿主机 /opt/portfolio）
# 与工作台共用同一个 nginx 容器和同一条 Cloudflare 隧道，
# 靠 Host 头区分，站点之间完全隔离（路径、Service Worker、缓存互不影响）。
# ============================================================
server {
    listen 80;
    server_name me.hongshenyu.dpdns.org;

    root /srv/portfolio;
    index index.html;

    # 隐藏文件一律不对外
    location ~ /\. { deny all; return 404; }

    # 入口页不缓存，保证改版 / 重新构建后刷新即刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容哈希的构建产物：长缓存 + immutable
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片 / 视频 / 字体
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|avif|mp4|webm|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 简历 PDF 允许短缓存，替换文件后一小时之内生效
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # 单页应用兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文本资源压缩（Vite 产物 JS/CSS 约 300KB，压完三分之一）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_vary on;
}
