server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态页面（单页，历史路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Service Worker：不缓存、正确 MIME
    # 注意：必须用 types{}/default_type 设置类型，不能用 add_header Content-Type，
    # 否则会与 nginx 自带的 Content-Type 叠加成两个同名响应头，浏览器会取到错误的那个。
    location = /sw.js {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA manifest：正确 MIME（mime.types 里没有 webmanifest，必须显式指定）
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 图标等静态资源缓存
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 安全：禁止访问后端源码 / 版本控制 / 配置等敏感路径
    location ~ ^/(server|\.git|\.github|\.workbuddy|node_modules|dist)/ {
        deny all;
        return 404;
    }
}
