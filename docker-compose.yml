version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guga
      POSTGRES_USER: guga
      POSTGRES_PASSWORD: ${PGPASSWORD:-guga}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guga -d guga"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://guga:${PGPASSWORD:-guga}@db:5432/guga
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态文件（index.html / sw.js / manifest / icons）
      - .:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
