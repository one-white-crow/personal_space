version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guga
      POSTGRES_USER: guga
      POSTGRES_PASSWORD: ${PGPASSWORD:-guga}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guga -d guga"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 生产环境从 GitHub Container Registry 拉取（CI 已构建好，服务器只增量拉取变化的层）
    image: ghcr.io/one-white-crow/personal_space-backend:latest
    # 本地开发时可用 build（docker compose up --build）；生产部署用 --no-build + pull
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://guga:${PGPASSWORD:-guga}@db:5432/guga
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态文件（index.html / sw.js / manifest / icons）
      - .:/usr/share/nginx/html:ro
      # 个人简历 / 作品集（独立子域名，放在仓库目录之外，
      # 这样 CI 的 rsync --delete 不会碰到它，也避免在主域名下暴露 /portfolio 路径）
      - /opt/portfolio:/srv/portfolio:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
