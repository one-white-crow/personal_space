name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # 1) 在 GitHub 构建后端镜像并推送到 GHCR（利用 layer cache，只重建改动的层）
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # GitHub Actions 缓存：代码改动只影响 COPY src 之后的层，依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) 部署：由 CI 主动把代码 rsync 到服务器（服务器无需访问 GitHub）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 确保服务器有 rsync
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "command -v rsync >/dev/null 2>&1 || (apt-get update && apt-get install -y rsync)"

      - name: 增量同步代码到服务器（rsync）
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.workbuddy/' \
            --exclude='.env' \
            --exclude='dist/' \
            --exclude='server/uploads/' \
            --exclude='.wbapp_*.genie' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/guga/

      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 国内服务器拉取镜像较慢，命令超时放宽到 1 小时
          command_timeout: 60m
          script: |
            set -e
            cd /opt/guga

            # 1) 写入环境变量（不提交到仓库；rsync 已排除，不会被覆盖）
            cat > .env <<EOF
            PGPASSWORD=${{ secrets.PGPASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            EOF

            # 2) 登录 GHCR，只拉取 backend 镜像中变化的层（未变化的层复用本地缓存）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend

            # 3) 只重启有变化的服务：--no-build 使用拉取的镜像；db/nginx 未变则保持运行
            docker compose up -d --no-build --remove-orphans

            # 4) 清理悬空镜像（不影响运行中的容器）
            docker image prune -f

            echo "✅ 部署完成"
