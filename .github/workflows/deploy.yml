name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # 1) 在 GitHub 构建后端镜像并推送到 GHCR（利用 layer cache，只重建改动的层）
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # GitHub Actions 缓存：代码改动只影响 COPY src 之后的层，依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) 到服务器上做增量部署
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # 0) 首次部署：目录不存在则自动创建并克隆仓库
            if [ ! -d /opt/guga/.git ]; then
              echo "首次部署，初始化 /opt/guga ..."
              mkdir -p /opt/guga
              git clone https://github.com/one-white-crow/personal_space.git /opt/guga
            fi

            cd /opt/guga

            # 1) 增量拉取代码（git 只传输变化的对象；前端静态资源由 nginx 直接读取，立即生效）
            git fetch origin
            git reset --hard origin/main

            # 2) 写入环境变量（不提交到仓库）
            cat > .env <<EOF
            PGPASSWORD=${{ secrets.PGPASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            EOF

            # 3) 登录 GHCR，只拉取 backend 镜像中变化的层（未变化的层复用本地缓存）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend

            # 4) 只重启有变化的服务：--no-build 使用拉取的镜像；db/nginx 未变则保持运行
            docker compose up -d --no-build --remove-orphans

            # 5) 清理悬空镜像（不影响运行中的容器）
            docker image prune -f

            echo "✅ 部署完成"
